name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - name: Run tests
        id: test
        run: npx tsx --test --test-reporter=spec test/*.test.ts 2>&1
        continue-on-error: true
      - name: Debug test failures
        if: steps.test.outcome != 'success'
        run: npx tsx --test --test-reporter=spec test/*.test.ts 2>&1 || true
      - run: npm run build
