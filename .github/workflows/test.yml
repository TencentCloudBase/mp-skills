name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - name: Run tests
        run: |
          set +e
          FAIL=0
          echo "=== installer ===" && npx tsx --test test/installer.test.ts || { echo "❌ installer FAILED"; FAIL=1; }
          echo "=== lock-file ===" && npx tsx --test test/lock-file.test.ts || { echo "❌ lock-file FAILED"; FAIL=1; }
          echo "=== sanitize ===" && npx tsx --test test/sanitize.test.ts || { echo "❌ sanitize FAILED"; FAIL=1; }
          echo "=== source-parser ===" && npx tsx --test test/source-parser.test.ts || { echo "❌ source-parser FAILED"; FAIL=1; }
          exit $FAIL
      - run: npm run build
