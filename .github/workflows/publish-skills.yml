name: Publish Skills

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - '.github/workflows/publish-skills.yml'
      - 'scripts/publish-to-clawhub.mjs'
      - 'scripts/publish-to-skillhub.mjs'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump: patch, minor, or major'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Build and validate only, skip publish'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── ClawHub 发布 ──
      - name: ClawHub - Generate publish info
        id: publish_info
        run: node scripts/publish-to-clawhub.mjs --skills-dir skills --bump "$BUMP"

      - name: ClawHub - Install CLI
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm install -g clawhub@latest

      - name: ClawHub - Login
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          CLAWDHUB_TOKEN: ${{ secrets.CLAWDHUB_TOKEN }}
        run: clawhub login --token "$CLAWDHUB_TOKEN" --no-browser

      - name: ClawHub - Publish each skill
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          CLAWDHUB_TOKEN: ${{ secrets.CLAWDHUB_TOKEN }}
        run: |
          node scripts/publish-to-clawhub.mjs --skills-dir skills --bump "$BUMP" --publish

      # ── SkillHub 发布 ──
      - name: SkillHub - Publish each skill
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          SKILLHUB_API_TOKEN: ${{ secrets.SKILLHUB_API_TOKEN }}
          SKILLHUB_ORG_ID: ${{ secrets.SKILLHUB_ORG_ID }}
        run: |
          node scripts/publish-to-skillhub.mjs --skills-dir skills --bump "$BUMP" --publish

      - name: Job summary
        run: |
          echo "## Skill Publish" >> "$GITHUB_STEP_SUMMARY"
          echo "- Skills: wxa-find-skills, wxa-create-ai-miniprogram, wxa-create-mp-skill, wxa-ai-mode-dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Targets: ClawHub + SkillHub" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bump: $BUMP" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry run: $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
