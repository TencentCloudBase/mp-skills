# ── 镜像同步 Workflow ──
# 事件驱动式将上游 GitHub 仓库同步到 cnb.cool 镜像。
#
# 触发方式：
#   1. repository_dispatch — awesome-miniprogram-skills 仓库 push 后自动通知
#   2. workflow_dispatch  — 手动触发（Actions 页面）
#
# 前提条件：
#   在 awesome-miniprogram-skills 仓库添加以下 workflow，
#   并在该仓库 Secrets 中配置 MP_SKILLS_PAT（mp-skills 仓库的 GitHub Token）：
#
#   ```yaml
#   # .github/workflows/notify-mp-skills.yml
#   name: Notify mp-skills to sync mirror
#   on: [push]
#   jobs:
#     notify:
#       runs-on: ubuntu-latest
#       steps:
#         - run: |
#             curl -X POST https://api.github.com/repos/TencentCloudBase/mp-skills/dispatches \
#               -H "Authorization: Bearer \${{ secrets.MP_SKILLS_PAT }}" \
#               -H "Accept: application/vnd.github+json" \
#               -d '{"event_type":"sync-mirrors"}'
#   ```
#
# 注意事项：
#   - wechat-miniprogram/ai-mode-demo（微信仓库）无法自动通知，需手动触发
#   - 在 mp-skills 仓库 Settings → Secrets 中配置 CNB_COOL_TOKEN

name: Sync Mirrors

on:
  repository_dispatch:
    types: [sync-mirrors]
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新同步全部镜像'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    name: Sync to cnb.cool
    runs-on: ubuntu-latest
    if: secrets.CNB_COOL_TOKEN != ''

    steps:
      - name: Checkout mp-skills
        uses: actions/checkout@v4

      - name: Setup git config
        run: |
          git config --global user.name "mp-skills-sync-bot"
          git config --global user.email "mp-skills-sync-bot@users.noreply.github.com"

      - name: Sync all mirrors
        env:
          CNB_COOL_TOKEN: ${{ secrets.CNB_COOL_TOKEN }}
        run: |
          node scripts/sync-mirror.mjs --all ${{ inputs.force && '--force' || '' }}
