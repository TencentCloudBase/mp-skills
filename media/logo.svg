<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#0f0f17"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window -->
  <rect x="10" y="8" width="540" height="104" rx="10" fill="url(#bg)" stroke="#2a2b3d" stroke-width="1.5"/>

  <!-- Title Bar -->
  <rect x="10" y="8" width="540" height="28" rx="10" fill="#1f2030"/>
  <rect x="10" y="26" width="540" height="10" fill="#1f2030"/>

  <!-- Traffic Lights -->
  <circle cx="36" cy="22" r="5" fill="#ff5555" opacity="0.9"/>
  <circle cx="54" cy="22" r="5" fill="#f1fa8c" opacity="0.9"/>
  <circle cx="72" cy="22" r="5" fill="#50fa7b" opacity="0.9"/>

  <!-- Title Text -->
  <text x="280" y="27" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="11" fill="#565f89" text-anchor="middle" dominant-baseline="middle">mp-skills</text>

  <!-- Command Line -->
  <!-- $ sign -->
  <text x="28" y="60" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="14" fill="#50fa7b" font-weight="bold">$</text>

  <!-- Command -->
  <text x="44" y="60" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="14" fill="#7aa2f7">mp-skills add TencentCloudBase/awesome-miniprogram-skills -s drink-skill</text>

  <!-- Output line -->
  <text x="28" y="86" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="13" fill="#9ece6a">  Install OK → drink-skill</text>

  <!-- Subtle glow line -->
  <line x1="10" y1="112" x2="550" y2="112" stroke="url(#glow)" stroke-width="1" opacity="0.3"/>
</svg>
