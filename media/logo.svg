<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100">
  <defs>
    <linearGradient id="txtGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#50fa7b"/>
    </linearGradient>
  </defs>

  <!-- Prompt -->
  <text x="20" y="58" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace" font-size="36" fill="#50fa7b" font-weight="bold">$</text>

  <!-- Command: find -->
  <text x="50" y="58" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace" font-size="36" fill="#7aa2f7" font-weight="700" letter-spacing="0.5">mp-skills find</text>

  <!-- Keyword with different color -->
  <text x="364" y="58" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace" font-size="36" fill="url(#txtGlow)" font-weight="700" letter-spacing="0.5">支付</text>

  <!-- Blinking cursor -->
  <rect x="448" y="28" width="9" height="40" rx="2" fill="#c0caf5" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.08;0.85" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Output line -->
  <text x="20" y="86" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace" font-size="13" fill="#9ece6a">  Found 2 skills (payment-skill, bill-skill)</text>
</svg>
